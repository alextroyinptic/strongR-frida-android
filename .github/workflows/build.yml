name: strongR-frida

on:
  schedule:
    - cron: "0 9/12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs: 
  check_version:
    runs-on: ubuntu-22.04

    outputs:
      FRIDA_VERSION: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
      ALREADY_RELEASE: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE }}
    steps:
      - name: Pull Frida Latest Release
        id: pullFridaLatestRelease
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const releaseResponse = await github.rest.repos.getLatestRelease({
              owner: 'frida',
              repo: 'frida',
            })
            const {
              data: { tag_name: ver }
            } = releaseResponse;
            core.setOutput('FRIDA_VERSION', ver);

      - name: Check release version
        id: checkReleaseVersion
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            try {
              const releaseVersion = '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'
              const releaseResponse = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseVersion
              });
              const {
                data: { tag_name: ver }
              } = releaseResponse;
              if (ver == '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'){
                  core.setOutput('ALREADY_RELEASE', '1');
              }
              else{
                  core.setOutput('ALREADY_RELEASE', '0');
              }
            } catch (e) {
              if(e.status === 404 || e.message === 'Not Found'){
                core.setOutput('ALREADY_RELEASE', '0');
              }
              else{
                core.setFailed(e.message);
              }
            }

  create_release:
    needs: check_version
    runs-on: ubuntu-22.04
    if: needs.check_version.outputs.ALREADY_RELEASE == '0'

    steps:
      - uses: softprops/action-gh-release@v2
        id: createRelease
        name: Create Runner Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          prerelease: false

  android_build:
    runs-on: ubuntu-22.04
    needs: [check_version, create_release]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1.5.0
      with:
        ndk-version: r29
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 xz-utils patch -y
        python3 -m pip install lief graphlib-backport

    - name: Build frida for Android
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git clone https://github.com/AAAA-Project/Patchs.git
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        git clone --depth 1 --branch ${{ needs.check_version.outputs.FRIDA_VERSION }} --recurse-submodules https://github.com/frida/frida

        cd frida
        for path in ../Patchs/strongR-frida/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          if [ -d "subprojects/$name" ]; then
            echo "Apply patches in $real to frida/subprojects/$name"
            cd subprojects/$name
            for pfile in ../../../Patchs/strongR-frida/$name/*.patch; do
              if [ -f "$pfile" ]; then
                patch -p1 --fuzz=3 -N < "$pfile" || true
              fi
            done
            cd ../..
          fi
        done

        # Remember where the source checkout lives, then step back out to the
        # workspace root - the rest of the build happens *outside* the source
        # tree, one directory per arch ("out-of-tree" builds, see frida's own
        # building docs: https://frida.re/docs/building/#oot).
        FRIDA_SRC="$(pwd)"
        cd ..

        ARCHES="android-arm android-arm64 android-x86 android-x86_64"
        mkdir -p dist
        for ARCH in $ARCHES
        do
          echo "::group::Building $ARCH"
          BUILD_DIR="build-$ARCH"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          # Each arch gets its own fresh build directory. Frida's configure
          # script refuses to reconfigure an existing ./build for a different
          # host - it just prints "Already configured. Wipe ./build to
          # reconfigure." and exits non-zero. Reusing frida/ (and therefore
          # frida/build) for every arch is what killed the loop right after
          # the first arch finished.
          (
            cd "$BUILD_DIR"
            "$FRIDA_SRC/configure" --host="$ARCH"
            make
          )

          # Build output lives under the build dir, mirroring the source
          # tree's layout - not under the source tree itself.
          cp "$BUILD_DIR/subprojects/frida-core/server/frida-server" "dist/frida-server-$ARCH" || true
          cp "$BUILD_DIR/subprojects/frida-core/inject/frida-inject" "dist/frida-inject-$ARCH" || true
          cp "$BUILD_DIR/subprojects/frida-core/lib/gadget/frida-gadget.so" "dist/frida-gadget-$ARCH.so" || true

          rm -rf "$BUILD_DIR"
          echo "::endgroup::"
        done

        echo "Collected artifacts:"
        ls -la dist/

    - name: Package build result for Android
      shell: bash
      run: |
        mkdir -p output
        cd dist
        for f in *; do
          if [ -f "$f" ]; then
            gzip -9 -c "$f" > "../output/$f.gz"
          fi
        done
        cd ..
        ls -la output/

    - name: Upload Release Assets for All Architectures
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
        files: output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
