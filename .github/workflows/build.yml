name: strongR-frida

on:
  schedule:
    - cron: "0 9/12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs: 
  check_version:
    runs-on: ubuntu-22.04

    outputs:
      FRIDA_VERSION: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
      ALREADY_RELEASE: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE }}
    steps:
      - name: Pull Frida Latest Release
        id: pullFridaLatestRelease
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const releaseResponse = await github.rest.repos.getLatestRelease({
              owner: 'frida',
              repo: 'frida',
            })
            const {
              data: { tag_name: ver }
            } = releaseResponse;
            core.setOutput('FRIDA_VERSION', ver);

      - name: Check release version
        id: checkReleaseVersion
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            try {
              const releaseVersion = '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'
              const releaseResponse = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseVersion
              });
              const {
                data: { tag_name: ver }
              } = releaseResponse;
              if (ver == '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}'){
                  core.setOutput('ALREADY_RELEASE', '1');
              }
              else{
                  core.setOutput('ALREADY_RELEASE', '0');
              }
            } catch (e) {
              if(e.status === 404 || e.message === 'Not Found'){
                core.setOutput('ALREADY_RELEASE', '0');
              }
              else{
                core.setFailed(e.message);
              }
            }

  create_release:
    needs: check_version
    runs-on: ubuntu-22.04
    if: needs.check_version.outputs.ALREADY_RELEASE == '0'

    steps:
      - uses: softprops/action-gh-release@v2
        id: createRelease
        name: Create Runner Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
          prerelease: false

  android_build:
    runs-on: ubuntu-22.04
    needs: [check_version, create_release]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1.5.0
      with:
        ndk-version: r25b
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 xz-utils -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib-backport

    - name: build frida for Android
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git clone https://github.com/AAAA-Project/Patchs.git
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        git clone --depth 1 --branch ${{ needs.check_version.outputs.FRIDA_VERSION }} --recurse-submodules https://github.com/frida/frida
        cd frida
        for path in ../Patchs/strongR-frida/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          if [ -d "subprojects/$name" ]; then
            echo "Apply patches in $real to frida/subprojects/$name"
            cd subprojects/$name
            git am ../../../Patchs/strongR-frida/$name/*.patch || true
            cd ../..
          fi
        done
        cd ..
        
        ARCHES="android-arm android-arm64 android-x86 android-x86_64"
        for ARCH in $ARCHES
        do
          mkdir build-$ARCH
          cd build-$ARCH
          ../frida/configure --host=$ARCH
          make
          cd ..
        done

    - name: Get release details
      id: checkReleaseVersion
      uses: actions/github-script@v7
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            const releaseVersion = '${{ needs.check_version.outputs.FRIDA_VERSION }}'
            const releaseResponse = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: releaseVersion
            })
            const {
              data: { id: releaseId, html_url: htmlUrl, upload_url: uploadUrl }
            } = releaseResponse;
            core.setOutput('id', releaseId);
            core.setOutput('html_url', htmlUrl);
            core.setOutput('upload_url', uploadUrl);
            core.setOutput('version', releaseVersion);
          } catch (e) {
            core.setFailed(e.message);
          }

    - name: package build result for Android
      shell: bash
      run: |
        gzip -9 build-android-arm/subprojects/frida-core/server/frida-server
        gzip -9 build-android-arm64/subprojects/frida-core/server/frida-server
        gzip -9 build-android-x86/subprojects/frida-core/server/frida-server
        gzip -9 build-android-x86_64/subprojects/frida-core/server/frida-server
        
        gzip -9 build-android-arm/subprojects/frida-core/inject/frida-inject
        gzip -9 build-android-arm64/subprojects/frida-core/inject/frida-inject
        gzip -9 build-android-x86/subprojects/frida-core/inject/frida-inject
        gzip -9 build-android-x86_64/subprojects/frida-core/inject/frida-inject
        
        gzip -9 build-android-arm/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip -9 build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip -9 build-android-x86/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip -9 build-android-x86_64/subprojects/frida-core/lib/gadget/frida-gadget.so

    - name: Upload Release Assets for All Architectures
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "${{ needs.check_version.outputs.FRIDA_VERSION }}"
        files: |
          build-android-arm/subprojects/frida-core/server/frida-server.gz
          build-android-arm64/subprojects/frida-core/server/frida-server.gz
          build-android-x86/subprojects/frida-core/server/frida-server.gz
          build-android-x86_64/subprojects/frida-core/server/frida-server.gz
          build-android-arm/subprojects/frida-core/inject/frida-inject.gz
          build-android-arm64/subprojects/frida-core/inject/frida-inject.gz
          build-android-x86/subprojects/frida-core/inject/frida-inject.gz
          build-android-x86_64/subprojects/frida-core/inject/frida-inject.gz
          build-android-arm/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
          build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
          build-android-x86/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
          build-android-x86_64/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
